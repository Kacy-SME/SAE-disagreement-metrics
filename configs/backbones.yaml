# Backbone registry for SAE experiments.
# Override checkpoint_path / model_id via env vars or CLI --config overrides.

backbones:
  momo:
    display_name: MOMO
    loader: momo
    model_id: Mirali33/MOMO
    checkpoint_path: null  # defaults to HF: vit-b-16/momo.pth
    checkpoint_filename: vit-b-16/momo.pth
    timm_model: vit_base_patch16_224
    num_layers: 12
    patch_size: 16
    hidden_dim: 768
    num_prefix_tokens: 1
    image_size: 224
    normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

  dinov3_sat493m:
    display_name: DINOv3_SAT493M
    loader: timm
    model_id: timm/vit_large_patch16_dinov3.sat493m
    checkpoint_path: null
    timm_model: vit_large_patch16_dinov3.sat493m
    num_layers: 24
    patch_size: 16
    hidden_dim: 1024
    num_prefix_tokens: 5  # CLS + 4 register tokens
    image_size: 224
    normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

  mars_orbital_vit:
    display_name: Mars_Orbital_ViT
    loader: mars_orbital_vit
    model_id: khatfie2/mars-orbital-vit
    checkpoint_path: null  # defaults to MARS_DRIVE_ROOT/.../best_backbone.pt
    timm_model: vit_base_patch14_dinov2
    num_layers: 12
    patch_size: 14
    hidden_dim: 768
    num_prefix_tokens: 5  # CLS + 4 register tokens
    num_register_tokens: 4
    image_size: 224
    normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

  prithvi_eo_2:
    display_name: Prithvi_EO_2.0
    loader: prithvi
    model_id: ibm-nasa-geospatial/Prithvi-EO-2.0-300M
    checkpoint_path: null
    num_layers: 12
    patch_size: 16
    hidden_dim: 768
    num_prefix_tokens: 1
    image_size: 224
    num_channels: 6
    normalize:
      mean: [0.035, 0.045, 0.035, 0.045, 0.05, 0.055]
      std: [0.035, 0.035, 0.035, 0.035, 0.035, 0.035]

  croma:
    display_name: CROMA
    loader: croma
    model_id: antofuller/CROMA
    checkpoint_path: null  # defaults to HF: CROMA_base.pt
    checkpoint_filename: CROMA_base.pt
    num_layers: 12
    patch_size: 8  # official CROMA s2_encoder patch size
    hidden_dim: 768
    num_prefix_tokens: 0  # patch-only ViT (no CLS)
    image_size: 128  # divisible by 8 (native CROMA pretrain uses 120)
    normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

  satmae_pp:
    display_name: SatMAE++
    loader: satmae_pp
    model_id: mubashir04/checkpoint_ViT-L_pretrain_fmow_rgb
    checkpoint_filename: checkpoint_ViT-L_pretrain_fmow_rgb.pth
    checkpoint_path: null
    timm_model: vit_large_patch16_224
    num_layers: 24
    patch_size: 16
    hidden_dim: 1024
    num_prefix_tokens: 1
    image_size: 224
    normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

  hirise_ctx_themis:
    display_name: MOMO_HiRISE_CTX_THEMIS
    loader: hirise_ctx_themis
    model_id: Mirali33/MOMO
    checkpoint_path: null
    checkpoint_filename: vit-b-16/hirise_ctx_themis.pth
    timm_model: vit_base_patch16_224
    num_layers: 12
    patch_size: 16
    hidden_dim: 768
    num_prefix_tokens: 1
    image_size: 224
    normalize:
      mean: [0.5006, 0.5006, 0.5006]
      std: [0.1664, 0.1664, 0.1664]

  anysat:
    display_name: AnySat
    loader: anysat
    model_id: g-astruc/AnySat
    checkpoint_path: null
    num_layers: 12
    patch_size: 16
    hidden_dim: 768
    num_prefix_tokens: 1
    image_size: 224
    normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
